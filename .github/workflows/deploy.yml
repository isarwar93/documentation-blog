name: Deploy Astro to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Repository variables are NOT masked by GitHub - only secrets are. GitHub echoes a
# `run:` script into the log with expressions already expanded, so variables are passed
# through `env:` and never interpolated into a command line. Keep step debug logging off,
# never `set -x` a step that reads one, and keep tool output quiet so it cannot echo them.
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDocumentationBlog
          aws-region: eu-north-1
          # Masks the account id inside this step's output.
          mask-aws-account-id: true

      - name: Deploy to S3
        env:
          # Bound as an environment variable, so the bucket name never appears in the
          # echoed script or in the sync output below.
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync ./dist "s3://${AWS_S3_BUCKET}" --delete --only-show-errors

      - name: Invalidate the CloudFront cache
        env:
          # Required, or the edge keeps serving HTML that points at the previous
          # build's hashed assets, which the sync above has already deleted. Those
          # pages then load with no CSS and a 403 in the console.
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${DISTRIBUTION_ID}" ]; then
            echo "::warning::AWS_CLOUDFRONT_DISTRIBUTION_ID is not set, so the cache was not" >&2
            echo "::warning::invalidated. Visitors may see unstyled pages until the TTL expires." >&2
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text

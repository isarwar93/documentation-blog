name: Deploy Astro to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Repository variables are NOT masked by GitHub - only secrets are. GitHub echoes a
# `run:` script into the log with expressions already expanded, so variables are passed
# through `env:` and never interpolated into a command line. Keep step debug logging off,
# never `set -x` a step that reads one, and keep tool output quiet so it cannot echo them.
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDocumentationBlog
          aws-region: eu-north-1
          # Masks the account id inside this step's output.
          mask-aws-account-id: true

      - name: Deploy to S3
        env:
          # Bound as an environment variable, so the bucket name never appears in the
          # echoed script or in the sync output below.
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          aws s3 sync ./dist "s3://${AWS_S3_BUCKET}" --delete --only-show-errors

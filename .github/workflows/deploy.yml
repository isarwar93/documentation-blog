name: Deploy Astro to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Git status:"
          git status

          echo "Lock files:"
          find . -maxdepth 2 -type f \( \
            -name "package-lock.json" -o \
            -name "npm-shrinkwrap.json" -o \
            -name "yarn.lock" \
          \) -print

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsDocumentationBlog
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://aws-s3-bucket1-static-website --delete